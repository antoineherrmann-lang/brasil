<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Do Brasil">
<link rel="apple-touch-icon" href="icon-180.jpg">
<link rel="icon" type="image/jpeg" href="icon-192.jpg">
<meta name="theme-color" content="#1B2410">
<link rel="manifest" href="manifest.json">
<title>Do Brasil — Apprendre le portugais brésilien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F1DC;
    --paper-light:#FFFCF0;
    --ink:#1B2410;
    --ink-soft:#5F6B45;
    --laterite:#E1432B;
    --laterite-dark:#B5341F;
    --jade:#0FA355;
    --jade-dark:#0B7A40;
    --gold:#E8C13A;
    --grad-deep:#1B2410;
    --grad-mid:#4B5B2A;
    --grad-light:#E8C13A;
    --line: rgba(31,42,23,0.14);
    --shadow: 0 10px 30px rgba(31,42,23,0.16);
    --tabbar-bg-1: rgba(255,255,255,0.48);
    --tabbar-bg-2: rgba(255,255,255,0.22);
    --tabbar-border: rgba(255,255,255,0.5);
    --tabbar-active-1: rgba(255,255,255,0.85);
    --tabbar-active-2: rgba(255,255,255,0.55);
    --glass-1: rgba(255,255,255,0.62);
    --glass-2: rgba(255,255,255,0.30);
    --glass-border: rgba(255,255,255,0.55);
    --role-verb-bg:#dfeaf8; --role-verb-border:#a3c3e6; --role-verb-ink:#1f3a5c;
    --role-subject-bg:#f4e7f8; --role-subject-border:#d2ade0; --role-subject-ink:#5c1f6e;
    --role-object-bg:#fdeddd; --role-object-border:#efba82; --role-object-ink:#7a4408;
    --role-adj-bg:#dff5ec; --role-adj-border:#92d8bd; --role-adj-ink:#0f5c40;
    --role-noun-bg:#fdf6d0; --role-noun-border:#e3c34f; --role-noun-ink:#6b5410;
    --role-particle-bg:#fbe4ea; --role-particle-border:#e8a8bb; --role-particle-ink:#7a1f36;
    --role-other-bg:#e3f1f3; --role-other-border:#a8ccd1; --role-other-ink:#1f4a52;
  }
  body.dark-mode{
    --paper:#14180C;
    --paper-light:#1E2412;
    --ink:#F3EDD6;
    --ink-soft:#A6A480;
    --laterite:#FF6B4D;
    --laterite-dark:#D9573A;
    --jade:#35D07A;
    --jade-dark:#279A5C;
    --gold:#F2D257;
    --line: rgba(237,234,218,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
    --tabbar-bg-1: rgba(33,43,25,0.72);
    --tabbar-bg-2: rgba(33,43,25,0.42);
    --tabbar-border: rgba(237,234,218,0.24);
    --tabbar-active-1: rgba(60,74,45,0.9);
    --tabbar-active-2: rgba(60,74,45,0.6);
    --glass-1: rgba(255,255,255,0.13);
    --glass-2: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.14);
    --role-verb-bg:#233248; --role-verb-border:#3d5675; --role-verb-ink:#a9c7ea;
    --role-subject-bg:#382a41; --role-subject-border:#5a4468; --role-subject-ink:#dcb3ea;
    --role-object-bg:#402d1c; --role-object-border:#664a29; --role-object-ink:#f0c184;
    --role-adj-bg:#1d3a30; --role-adj-border:#33604e; --role-adj-ink:#8fe0c0;
    --role-noun-bg:#3a3016; --role-noun-border:#6b5a28; --role-noun-ink:#f0d878;
    --role-particle-bg:#3a2530; --role-particle-border:#6b4152; --role-particle-ink:#f2b8cc;
    --role-other-bg:#1c3438; --role-other-border:#3a5f66; --role-other-ink:#a8dde3;
  }
  *{box-sizing:border-box; touch-action:manipulation;}
  html,body{margin:0;padding:0;}
  body{ padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); transition:background-color .3s ease, color .3s ease; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:0.005em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, .selectable:focus-visible{
    outline:3px solid var(--jade);
    outline-offset:2px;
  }

  .lamba-band{
    height:16px;
    width:100%;
    background: radial-gradient(circle at 15% 90%, var(--grad-light) 0%, var(--grad-mid) 45%, var(--grad-deep) 85%);
  }
  .lamba-band.thin{ height:8px; }

  #app{ max-width:720px; margin:0 auto; padding-bottom:60px; }
  .container{ padding:28px 20px 0; }

  .home-header{ padding:8px 0 6px; }
  .eyebrow{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:12px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--jade-dark);
    background:rgba(63,107,53,0.1); padding:4px 10px; border-radius:100px; margin-bottom:14px;
  }
  .hero-card{
    background: radial-gradient(circle, var(--grad-light) 0%, var(--grad-mid) 42%, var(--grad-deep) 100%);
    background-size:200% 200%;
    border-radius:22px; padding:22px 20px; box-shadow:0 14px 34px rgba(31,42,23,0.32), inset 0 1px 0 rgba(255,255,255,0.15);
    position:relative; overflow:hidden;
    animation:heroDrift 14s ease-in-out infinite alternate;
  }
  @keyframes heroDrift{
    0%{ background-position:12% 8%; }
    50%{ background-position:30% 26%; }
    100%{ background-position:18% 14%; }
  }
  .hero-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .hero-logo{
    width:83px; color:#fff;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.22));
  }
  .hero-logo svg{ display:block; width:100%; height:auto; }
  .hero-sub{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,0.85); margin-top:8px; }
  .hero-gloss{ text-transform:none; letter-spacing:0; opacity:0.8; }
  .home-section{ margin-top:26px; }
  .chat-bubble-wrap{ display:flex; justify-content:center; padding:0 20px; margin-top:16px; position:relative; z-index:3; }
  .chat-bubble-wrap.left-aligned{ justify-content:flex-start; }
  .chat-bubble{
    position:relative; background:linear-gradient(160deg, var(--glass-1), var(--glass-2));
    backdrop-filter:var(--glass-blur, blur(22px) saturate(190%)); -webkit-backdrop-filter:var(--glass-blur, blur(22px) saturate(190%));
    border:1px solid var(--glass-border); border-radius:18px;
    padding:12px 17px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:8px; max-width:100%;
    opacity:0; transform:translateY(-14px);
    animation:chatBubblePop .5s cubic-bezier(.34,1.56,.64,1) .5s forwards;
  }
  .chat-bubble-emoji{ font-size:15px; flex-shrink:0; }
  .chat-bubble-text{ font-size:13px; color:var(--ink); line-height:1.4; }
  @keyframes chatBubblePop{
    0%{ opacity:0; transform:translateY(-14px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  .home-section-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); margin-bottom:10px; padding-left:2px; }
  .footer-version{ display:block; width:100%; text-align:center; font-size:10.5px; color:var(--ink-soft); opacity:0.4; margin-top:28px; padding-bottom:6px; background:none; border:none; text-decoration:underline; text-decoration-color:transparent; }
  .footer-version:active{ opacity:0.7; }

  .changelog-weight{ margin:16px 20px 0; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--jade-dark); background:rgba(63,107,53,0.08); border-radius:10px; padding:8px 12px; }
  .changelog-entry{ margin:0 20px 14px; background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:var(--glass-blur, blur(22px) saturate(190%)); -webkit-backdrop-filter:var(--glass-blur, blur(22px) saturate(190%)); border:1px solid var(--glass-border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .changelog-version{ font-family:'Baloo 2',sans-serif; font-size:15px; color:var(--jade-dark); letter-spacing:.01em; }
  .changelog-name{ font-family:'Work Sans',sans-serif; font-weight:400; color:var(--ink-soft); font-size:13px; }
  .changelog-list{ margin:8px 0 0; padding-left:18px; }
  .changelog-group{ margin:0 20px 14px; }
  .changelog-group-title{
    font-family:'Baloo 2',sans-serif; font-size:14px; color:var(--ink-soft); cursor:pointer; list-style:none;
    padding:10px 4px; display:flex; align-items:center; gap:8px;
  }
  .changelog-group-title::-webkit-details-marker{ display:none; }
  .changelog-group-count{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:400; color:var(--ink-soft); opacity:0.7; }
  .changelog-group .changelog-entry{ margin:0 0 14px; }
  .changelog-group[open] .changelog-entry:first-of-type{ margin-top:4px; }
  .changelog-list li{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .changelog-group-block{ margin:0 0 22px; }
  .changelog-group-label{ margin:0 20px 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--jade-dark); display:flex; align-items:center; gap:8px; }
  .changelog-group-range{ color:var(--ink-soft); text-transform:none; letter-spacing:normal; opacity:0.75; }
  .changelog-group-older{ border-top:1px solid var(--line); margin:8px 20px 0; padding-top:4px; }
  .changelog-group-older > .changelog-group-title{ padding:12px 4px; }
  .changelog-group-older .changelog-group-block{ margin:0 0 18px; }
  .changelog-group-older .changelog-group-label{ margin:0 0 8px; }
  .changelog-group-older .changelog-group-block .changelog-group{ margin:0 0 14px; }

  .tabbar-blur-fade{
    position:fixed; left:0; right:0; bottom:0; z-index:45; pointer-events:none;
    height:calc(96px + env(safe-area-inset-bottom, 0px));
    backdrop-filter:blur(11px); -webkit-backdrop-filter:blur(11px);
    mask-image:linear-gradient(to top, black 0%, black 25%, transparent 100%);
    -webkit-mask-image:linear-gradient(to top, black 0%, black 25%, transparent 100%);
  }
  .tab-bar{
    position:fixed; left:18px; right:18px; bottom:calc(env(safe-area-inset-bottom, 0px) - 8px); z-index:50;
    display:flex; gap:3px;
    background:
      linear-gradient(180deg, var(--tabbar-bg-1), var(--tabbar-bg-2));
    backdrop-filter:blur(28px) saturate(200%);
    -webkit-backdrop-filter:blur(28px) saturate(200%);
   
    border-radius:24px;
    border:1px solid var(--tabbar-border);
    box-shadow:
      0 12px 32px rgba(31,42,23,0.22),
      0 1px 1px rgba(255,255,255,0.18),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -1px 6px rgba(31,42,23,0.06);
    padding:4px;
  }
  .tab-slider{
    position:absolute; top:4px; bottom:4px; left:0; width:0;
    transition:transform .36s cubic-bezier(.34,1.56,.64,1), width .28s ease;
    z-index:0;
  }
  .tab-slider-fill{
    width:100%; height:100%; transform-origin:center;
    background:linear-gradient(180deg, var(--tabbar-active-1), var(--tabbar-active-2));
    border-radius:18px;
    box-shadow:
      0 3px 10px rgba(31,42,23,0.14),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }
  @keyframes sliderOrganic{
    0%{ transform:scaleY(1); }
    32%{ transform:scaleY(0.88); }
    62%{ transform:scaleY(1.07); }
    100%{ transform:scaleY(1); }
  }
  .tab-slider-fill.pop{ animation:sliderOrganic .4s cubic-bezier(.34,1.56,.64,1); }
  .tab-btn{
    position:relative; z-index:1;
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:none; border:none; border-radius:18px; padding:6px 2px 5px; color:var(--ink-soft);
    transition:transform .15s ease;
  }
  .tab-emoji{ display:flex; align-items:center; justify-content:center; opacity:0.55; transition:opacity .2s ease, transform .2s ease, color .2s ease; }
  .tab-label{ font-size:9px; font-family:'IBM Plex Mono',monospace; opacity:0.6; transition:opacity .2s ease, color .2s ease; }
  .tab-btn.active .tab-emoji{ opacity:1; transform:translateY(-1px); color:var(--jade-dark); }
  .tab-btn.active .tab-label{ opacity:1; color:var(--jade-dark); font-weight:700; }
  .tab-btn:active{ transform:scale(0.96); }

  .theme-toggle{
    width:34px; height:34px; border-radius:100px; flex-shrink:0;
    border:1px solid rgba(255,255,255,0.4); background:rgba(255,255,255,0.18); font-size:16px; color:#fff;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px);
  }
  .theme-toggle{ transition:transform .2s ease; }
  .theme-toggle:active{ transform:scale(0.9) rotate(35deg); }

  .mission-card{
    background:linear-gradient(155deg, var(--grad-mid), var(--grad-deep)); color:#fff;
    border-radius:16px; padding:16px 18px; margin-top:16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .mission-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,0.75); }
  .mission-body{ display:flex; align-items:center; gap:12px; margin-top:8px; }
  .mission-emoji{ font-size:26px; flex-shrink:0; }
  .mission-text{ font-size:13px; line-height:1.4; color:#fff; }
  .mission-btn{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.35); color:#fff; border-radius:100px; padding:9px 16px; font-size:12px; font-weight:600; margin-top:12px; }
  .mission-btn:active{ transform:scale(0.95); }

  .home-pair-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .home-pair-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  .next-badge-card, .cross-challenge-card{
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:var(--glass-blur, blur(22px) saturate(190%)); -webkit-backdrop-filter:var(--glass-blur, blur(22px) saturate(190%));
    border:1px solid var(--glass-border); border-radius:16px; padding:14px 14px; box-shadow:var(--shadow);
    display:block; width:100%; text-align:left; -webkit-appearance:none; appearance:none;
  }
  .cross-challenge-card:active, .next-badge-card:active{ transform:scale(0.97); }
  .next-badge-body{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .next-badge-emoji{ font-size:22px; flex-shrink:0; }
  .next-badge-info{ flex:1; min-width:0; }
  .next-badge-name{ font-family:'Baloo 2',sans-serif; font-size:12.5px; color:var(--ink); line-height:1.25; }
  .next-badge-track{ height:6px; border-radius:100px; background:var(--line); margin-top:6px; overflow:hidden; }
  .next-badge-fill{ height:100%; background:var(--gold); border-radius:100px; transition:width .5s ease; }
  .next-badge-sub{ font-size:10px; color:var(--ink-soft); margin-top:4px; font-family:'IBM Plex Mono',monospace; }
  .cross-challenge-body{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .cross-challenge-emoji{ font-size:22px; flex-shrink:0; }
  .cross-challenge-info{ min-width:0; }
  .cross-challenge-title{ font-family:'Baloo 2',sans-serif; font-size:12.5px; color:var(--ink); line-height:1.25; }
  .cross-challenge-sub{ font-size:10px; color:var(--ink-soft); margin-top:2px; }

  .today-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .today-card{
    text-align:left; border:none; border-radius:16px; padding:14px 14px 12px;
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:var(--glass-blur, blur(22px) saturate(190%)); -webkit-backdrop-filter:var(--glass-blur, blur(22px) saturate(190%));
    border:1px solid var(--glass-border); box-shadow:var(--shadow);
  }
  .today-card:active{ transform:scale(0.97); }
  .today-card-top{ display:flex; align-items:center; gap:6px; }
  .today-card-emoji{ font-size:15px; }
  .today-card-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .today-card-value{ font-family:'Baloo 2',sans-serif; font-size:26px; color:var(--ink); margin-top:6px; line-height:1; }
  .today-card-unit{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-left:3px; }
  .today-card-sub{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }
  .today-card-split .today-card-value{ font-size:20px; }
  .today-card-divider{ height:1px; background:var(--line); margin:9px 0; }
  .today-mini-dots{ display:flex; gap:3px; margin-top:10px; }
  .today-mini-dot{ width:100%; height:5px; border-radius:3px; background:var(--line); transition:background .3s ease; }
  .today-mini-dot.filled{ background:var(--laterite); animation:staggerPop .35s cubic-bezier(.22,.61,.36,1) both; }
  .today-streak-card{
    display:block; width:100%; margin:10px 0 0; border-radius:16px; padding:16px 16px 14px;
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:var(--glass-blur, blur(22px) saturate(190%)); -webkit-backdrop-filter:var(--glass-blur, blur(22px) saturate(190%));
    border:1px solid var(--glass-border); box-shadow:var(--shadow); text-align:left;
    -webkit-appearance:none; appearance:none; box-sizing:border-box;
  }
  .today-streak-card:active{ transform:scale(0.985); }
  .today-streak-top{ display:flex; align-items:center; justify-content:space-between; }
  .today-streak-values{ display:flex; align-items:baseline; gap:8px; }
  .today-card-value-pop{ animation:staggerPop .5s cubic-bezier(.22,.61,.36,1) .15s both; }


  .stats-section{ margin-top:22px; padding:0 20px; }
  .reveal-on-scroll{ opacity:0; transform:translateY(24px); transition:opacity .6s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1); }
  .reveal-on-scroll.revealed{ opacity:1; transform:translateY(0); }
  .stats-section.compact .calendar-weekdays{ margin-bottom:4px; }
  .stats-section.compact .calendar-grid{ gap:4px; }
  .stats-section.compact .calendar-cell{ font-size:10px; border-radius:6px; }
  .stats-section.compact .calendar-nav{ margin-bottom:6px; }
  .stats-section.compact .calendar-hint{ font-size:10px; margin-top:6px; }
  .update-toast{
    position:fixed; left:50%; bottom:-60px; transform:translateX(-50%); z-index:9999;
    display:flex; align-items:center; gap:8px; padding:12px 18px; border-radius:100px;
    background:linear-gradient(155deg, var(--grad-mid), var(--grad-deep)); color:#fff;
    font-size:12.5px; font-weight:600; box-shadow:0 10px 26px rgba(31,42,23,0.35);
    transition:bottom .4s cubic-bezier(.22,.61,.36,1), opacity .4s ease; opacity:0; white-space:nowrap;
  }
  .update-toast.show{ bottom:26px; opacity:1; }
  .update-toast svg{ flex-shrink:0; }
  .stats-section-title{ font-family:'Baloo 2',sans-serif; font-size:16px; margin-bottom:10px; letter-spacing:.01em; }
  .calendar-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .calendar-weekday{ font-size:9px; text-align:center; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; }
  .calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .calendar-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:11px; font-family:'IBM Plex Mono',monospace; font-weight:600; border:1px solid var(--glass-border); padding:0; position:relative; transition:background-color .3s ease; }
  .calendar-cell.active{ box-shadow:0 0 0 2px var(--jade-dark) inset; }
  .calendar-cell.picked{ box-shadow:0 0 0 2px #fff inset, 0 0 0 3px rgba(0,0,0,0.3); }
  .calendar-cell.active.picked{ box-shadow:0 0 0 2px #fff inset, 0 0 0 4px var(--jade-dark); }
  .cal-today-dot{ position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%; background:var(--gold); }
  .calendar-cell.empty{ background:none; border:none; }
  .calendar-cell:disabled{ opacity:0.35; }
  .calendar-cell:active{ transform:scale(0.9); }
  .calendar-hint{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:10px; }

function findNextBadge(){
  const unlocked = new Set(unlockedBadgeIds(progress));
  let best = null;
  NEXT_BADGE_TRACKERS.forEach(t=>{
    if(unlocked.has(t.id)) return;
    const cur = Math.min(t.current(progress), t.target);
    const remaining = t.target - cur;
    if(remaining <= 0) return;
    if(!best || remaining < best.remaining){
      const badge = BADGES.find(b=>b.id===t.id);
      if(badge) best = { badge, cur, target:t.target, remaining };
    }
  });
  return best;
}

function computePerformanceTier(mode, s){
  if(!s || mode === 'cards') return null;
  if(s.total !== undefined && s.correct !== undefined && s.total > 0){
    const ratio = s.correct / s.total;
    if(ratio >= 0.99) return 'perfect';
    if(ratio >= 0.75) return 'great';
    if(ratio >= 0.45) return 'good';
    return 'low';
  }
  if(s.mistakes !== undefined){
    if(s.mistakes === 0) return 'perfect';
    if(s.mistakes <= 2) return 'great';
    if(s.mistakes <= 5) return 'good';
    return 'low';
  }
  if(mode === 'chrono'){
    if(s.bestCombo >= 10) return 'perfect';
    if(s.bestCombo >= 6) return 'great';
    if(s.bestCombo >= 3) return 'good';
    return 'low';
  }
  if(mode === 'survival' || mode === 'grammar-survival'){
    if(s.correct >= 15) return 'perfect';
    if(s.correct >= 10) return 'great';
    if(s.correct >= 5) return 'good';
    return 'low';
  }
  return null;
}
function getPerformanceReaction(mode, s){
  const tier = computePerformanceTier(mode, s);
  if(!tier) return null;
  const pools = { perfect:REACTION_PERFECT, great:REACTION_GREAT, good:REACTION_GOOD, low:REACTION_LOW };
  const pool = pools[tier];
  const entry = pool[Math.floor(Math.random()*pool.length)];
  const name = (progress.userName||'').trim();
  return name ? entry.withName.replace('{name}', name) : entry.noName;
}
function pickFromPool(pool, seedStr){
  let hash = 3;
  for(let i=0;i<seedStr.length;i++){ hash = (hash*41 + seedStr.charCodeAt(i)) >>> 0; }
  return pool[hash % pool.length];
}
function motivationPhrase(dateStr){
  const name = (progress.userName||'').trim();
  const hour = new Date().getHours();
  const bucket = Math.floor(hour/6);
  const seedStr = dateStr + '-' + bucket;
  const todayXp = (progress.daily && progress.daily.xp) || 0;
  const streakCount = (progress.streak && progress.streak.count) || 0;

  let pool = MOTIVATION_PHRASES;
  if(streakCount >= 7 && Math.floor(hour/6) % 2 === 0){ pool = MOTIVATION_STREAK; }
  else if(todayXp === 0 && hour < 11){ pool = MOTIVATION_MORNING; }
  else if(todayXp === 0 && hour >= 20){ pool = MOTIVATION_EVENING; }
  else if(todayXp >= 200){ pool = MOTIVATION_PRODUCTIVE; }

  const entry = pickFromPool(pool, seedStr);
  let text = name ? entry.withName : entry.noName;
  text = text.replace('{name}', name).replace('{streak}', formatNumber(streakCount)).replace('{xp}', formatNumber(todayXp));
  return text;
}
function wordOfTheDay(dateStr){
  const words = allWords();
  let hash = 7;
  for(let i=0;i<dateStr.length;i++){ hash = (hash*37 + dateStr.charCodeAt(i)) >>> 0; }
  return words[hash % words.length];
}
function ensureDaily(){
  const today = todayStr();
  if(!progress.daily || progress.daily.date !== today){
    if(progress.daily && progress.daily.date){
      if(!progress.xpHistory) progress.xpHistory = [];
      progress.xpHistory.push({ date: progress.daily.date, xp: progress.daily.xp||0 });
      if(progress.xpHistory.length > 60) progress.xpHistory = progress.xpHistory.slice(-60);
    }
    progress.daily = { date: today, xp:0, cards:0, maki:0, quiz:0, claimed:false, hourly:new Array(24).fill(0) };
  }
  if(!progress.daily.hourly) progress.daily.hourly = new Array(24).fill(0);
}
function bumpDaily(metric, amount){
  ensureDaily();
  progress.daily[metric] = (progress.daily[metric]||0) + amount;
  markTodayActive();
}
function formatNumber(n){
  n = Math.round(n||0);
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
}
function grantXP(amount){
  progress.xp += amount;
  bumpDaily('xp', amount);
  const h = new Date().getHours();
  progress.daily.hourly[h] = (progress.daily.hourly[h]||0) + amount;
}

function initTabBar(){
  const blurFade = document.createElement('div');
  blurFade.className = 'tabbar-blur-fade';
  document.body.appendChild(blurFade);
  const bar = document.createElement('div');
  bar.className = 'tab-bar';
  bar.innerHTML = `
    <div class="tab-slider" id="tabSlider"><div class="tab-slider-fill" id="tabSliderFill"></div></div>
    ${TABS.map(t => `
      <button class="tab-btn selectable" data-tab="${t.id}">
        <div class="tab-emoji">${feather(t.icon, 20)}</div>
        <div class="tab-label">${t.label}</div>
      </button>
    `).join('')}
  `;
  document.body.appendChild(bar);
  bar.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(tabBarDragged){ tabBarDragged = false; return; }
      screen = { name: btn.dataset.tab };
      render();
    });
  });

  let dragging = false;
  let startX = 0;
  bar.addEventListener('pointerdown', (e)=>{
    dragging = true;
    tabBarDragged = false;
    startX = e.clientX;
    try{ bar.setPointerCapture(e.pointerId); }catch(err){}
  });
  bar.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    if(!tabBarDragged && Math.abs(e.clientX - startX) > 6) tabBarDragged = true;
    if(!tabBarDragged) return;
    const slider = document.getElementById('tabSlider');
    const firstBtn = bar.querySelector('.tab-btn');
    if(!slider || !firstBtn) return;
    const barRect = bar.getBoundingClientRect();
    const btnWidth = firstBtn.getBoundingClientRect().width;
    let x = e.clientX - barRect.left - btnWidth/2;
    x = Math.max(4, Math.min(x, barRect.width - btnWidth - 4));
    slider.style.transition = 'none';
    slider.style.transform = `translateX(${x}px)`;
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    if(!tabBarDragged) return;
    const btns = [...bar.querySelectorAll('.tab-btn')];
    let closestIdx = 0, closestDist = Infinity;
    btns.forEach((b,i)=>{
      const r = b.getBoundingClientRect();
      const center = r.left + r.width/2;
      const dist = Math.abs(e.clientX - center);
      if(dist < closestDist){ closestDist = dist; closestIdx = i; }
    });
    const slider = document.getElementById('tabSlider');
    if(slider) slider.style.transition = '';
    screen = { name: TABS[closestIdx].id };
    render();
  }
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', ()=>{ dragging = false; tabBarDragged = false; });
}
let lastActiveTab = null;
let tabBarDragged = false;
function updateTabBar(screenName){
  const bar = document.querySelector('.tab-bar');
  if(!bar) return;
  const activeId = SCREEN_TAB_MAP[screenName] || 'home';
  bar.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab === activeId);
  });
  const activeBtn = bar.querySelector(`.tab-btn[data-tab="${activeId}"]`);
  const slider = document.getElementById('tabSlider');
  if(activeBtn && slider){
    const barRect = bar.getBoundingClientRect();
    const btnRect = activeBtn.getBoundingClientRect();
    slider.style.width = btnRect.width + 'px';
    slider.style.transform = `translateX(${btnRect.left - barRect.left}px)`;
    if(activeId !== lastActiveTab){
      const fill = document.getElementById('tabSliderFill');
      if(fill){
        fill.classList.remove('pop');
        void fill.offsetWidth;
        fill.classList.add('pop');
      }
      lastActiveTab = activeId;
    }
  }
}

async function loadProgress(){
  try{
    const raw = localStorage.getItem('malagasy-progress');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.chapters){
        progress = freshProgress();
        progress.chapters = parsed.chapters || {};
        progress.xp = parsed.xp || 0;
        progress.revision = Object.assign(freshProgress().revision, parsed.revision || {});
        progress.srs = parsed.srs || {};
        progress.srsSessionsCompleted = parsed.srsSessionsCompleted || 0;
        progress.streak = parsed.streak || { count:0, lastDate:null, history:[] };
        if(!progress.streak.history){
          progress.streak.history = [];
          if(progress.streak.count > 0 && progress.streak.lastDate){
            const end = new Date(progress.streak.lastDate + 'T00:00:00');
            for(let i = progress.streak.count - 1; i >= 0; i--){
              const d = new Date(end.getTime() - i*86400000);
              progress.streak.history.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
            }
          }
        }
        progress.miniGame = parsed.miniGame || { best:0 };
        progress.cardsLearned = parsed.cardsLearned || 0;
        progress.daily = parsed.daily || { date:null, xp:0, cards:0, maki:0, quiz:0, claimed:false };
        progress.themeMode = parsed.themeMode || (parsed.darkMode ? 'dark' : 'auto');
        progress.xpHistory = parsed.xpHistory || [];
        progress.userName = parsed.userName || '';
        progress.nameModalShown = parsed.nameModalShown || false;
        progress.miniGame = progress.miniGame || { best:0, bestHard:0 };
        if(progress.miniGame.bestHard === undefined) progress.miniGame.bestHard = 0;
      } else if(parsed && typeof parsed === 'object'){
        progress = freshProgress();
        progress.chapters = parsed;
      }
    }
  }catch(e){ progress = freshProgress(); }
  if(!progress.streak) progress.streak = { count:0, lastDate:null, history:[], best:0 };
  if(progress.streak.best === undefined) progress.streak.best = progress.streak.count||0;
  recomputeStreakCount();
  applyTheme();
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = ()=>{ if(progress.themeMode === 'auto'){ applyTheme(); render(); } };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      window.scrollTo(0, 0);
      const prevCount = progress.streak.count;
      recomputeStreakCount();
      if(progress.streak.count !== prevCount) render();
    }
  });
  window.addEventListener('pageshow', ()=> window.scrollTo(0, 0));
  render();
  if(!progress.nameModalShown){
    setTimeout(showNameModal, 350);
  }
}

let edgeSwipe = null;
const EDGE_ZONE = 24, EDGE_THRESHOLD = 80;

document.addEventListener('pointerdown', (e)=>{
  if(e.clientX > EDGE_ZONE) return;
  if(e.target.closest('.tab-bar, .swipe-card, .badge-modal-backdrop, .dict-search')) return;
  edgeSwipe = { startX:e.clientX, startY:e.clientY, dx:0, aborted:false };
});
document.addEventListener('pointermove', (e)=>{
  if(!edgeSwipe) return;
  const dx = e.clientX - edgeSwipe.startX;
  const dy = e.clientY - edgeSwipe.startY;
  if(!edgeSwipe.aborted && Math.abs(dy) > Math.abs(dx) + 12){
    edgeSwipe.aborted = true;
    edgeHint.style.opacity = 0;
    return;
  }
  if(edgeSwipe.aborted) return;
  edgeSwipe.dx = dx;
  if(dx > 0){
    edgeHint.style.opacity = Math.min(1, dx / EDGE_THRESHOLD);
    edgeHint.style.transform = `translateY(-50%) translateX(${Math.min(dx*0.4, 26)}px)`;
  }
});
document.addEventListener('pointerup', ()=>{
  if(!edgeSwipe) return;
  edgeHint.style.opacity = 0;
  edgeHint.style.transform = 'translateY(-50%)';
  if(!edgeSwipe.aborted && edgeSwipe.dx > EDGE_THRESHOLD){
    const backBtn = document.querySelector('.back-btn');
    if(backBtn) backBtn.click();
  }
  edgeSwipe = null;
});
document.addEventListener('pointercancel', ()=>{
  if(edgeSwipe){ edgeHint.style.opacity = 0; edgeSwipe = null; }
});

function todayStr(){

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateStrDaysAgo(n){
  const d = new Date(Date.now() - n*86400000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const DAY_LETTERS = ['D','L','M','M','J','V','S']; // getDay(): 0=dimanche
function buildStreakDots(){
  const history = (progress.streak && progress.streak.history) || [];
  const days = [];
  for(let i = 9; i >= 0; i--){
    const dateStr = dateStrDaysAgo(i);
    const d = new Date(dateStr + 'T00:00:00');
    days.push({ dateStr, filled: history.includes(dateStr), label: DAY_LETTERS[d.getDay()] });
  }
  return days;
}
function markTodayActive(){
  if(!progress.streak) progress.streak = { count:0, lastDate:null, history:[], best:0 };
  if(!progress.streak.history) progress.streak.history = [];
  const today = todayStr();
  if(!progress.streak.history.includes(today)){
    progress.streak.history.push(today);
    if(progress.streak.history.length > 60) progress.streak.history = progress.streak.history.slice(-60);
  }
  progress.streak.lastDate = today;
  recomputeStreakCount();
  saveProgress();
}

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function makeQCM(word, pool, direction, numDistractors){
  numDistractors = numDistractors || 3;
  const prompt = direction === 'mg2fr' ? word.mg : word.fr;
  const correct = direction === 'mg2fr' ? word.fr : word.mg;
  let distractors = pool.filter(x=>x!==word).map(x=> direction==='mg2fr' ? x.fr : x.mg);
  distractors = shuffle(distractors).slice(0,numDistractors);
  const options = shuffle([correct, ...distractors]);
  return { type:'qcm', direction, prompt, correct, options };
}

function buildQuestions(chapter){
  const words = chapter.words;
  const qcm = words.map((w,i)=> makeQCM(w, words, i % 2 === 0 ? 'mg2fr' : 'fr2mg'));
  const matchWords = shuffle(words).slice(0, Math.min(6, words.length));
  return { qcm: shuffle(qcm), match: matchWords };
}

function allWords(){
  return LEVELS.flatMap(l => l.chapters.flatMap(c => c.words.map(w => ({
    mg: w.mg, fr: w.fr, tip: w.tip || '', key: c.id + '::' + w.mg, levelId: l.id
  }))));
}

const NUMBER_WORDS_FR = { 1:'un', 2:'deux', 3:'trois', 4:'quatre', 5:'cinq', 6:'six', 7:'sept', 8:'huit', 9:'neuf', 10:'dix' };
function normalizeSearch(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}
function searchDictionary(query){
  const words = allWords();
  const q = normalizeSearch(query || '');
  if(!q) return words.slice().sort((a,b)=> a.mg.localeCompare(b.mg, 'fr'));
  let numberHint = '';
  if(/^\d+$/.test(q)){
    const n = parseInt(q, 10);
    if(NUMBER_WORDS_FR[n]) numberHint = normalizeSearch(NUMBER_WORDS_FR[n]);
  }
  return words
    .filter(w=>{
      const mg = normalizeSearch(w.mg), fr = normalizeSearch(w.fr);
      if(mg.includes(q) || fr.includes(q)) return true;
      if(numberHint && fr === numberHint) return true;
      return false;
    })
    .sort((a,b)=> a.mg.localeCompare(b.mg, 'fr'));
}

function srsDueList(now){
  return allWords().filter(w=>{
    const c = progress.srs[w.key];
    return c && c.due <= now;
  }).sort((a,b)=> progress.srs[a.key].due - progress.srs[b.key].due);
}
function srsNewList(){
  return allWords().filter(w => !progress.srs[w.key]);
}
function srsNextDue(now){
  const upcoming = allWords()
    .map(w=>progress.srs[w.key])
    .filter(c=>c && c.due > now)
    .sort((a,b)=>a.due-b.due);
  return upcoming.length ? upcoming[0].due : null;
}
function humanDelay(ms){
  if(ms < 3600000) return `${Math.max(1, Math.round(ms/60000))} min`;
  if(ms < 86400000) return `${Math.round(ms/3600000)} h`;
  return `${Math.round(ms/86400000)} j`;
}
function buildSrsQueue(){
  const now = Date.now();
  const due = srsDueList(now).slice(0, 20);
  const remaining = Math.max(0, 20 - due.length);
  const fresh = shuffle(srsNewList()).slice(0, Math.min(10, remaining));
  return [...shuffle(due), ...shuffle(fresh)].map(w=>w.key);
}
function srsRecordAnswer(key, correct){
  const now = Date.now();
  let card = progress.srs[key];
  if(!card) card = { ef:2.5, interval:0, reps:0, due: now };
  if(correct){
    card.reps++;
    if(card.reps === 1) card.interval = 1;
    else if(card.reps === 2) card.interval = 6;
    else card.interval = Math.round(card.interval * card.ef);
    card.ef = Math.min(2.8, card.ef + 0.05);
    card.due = now + card.interval * 86400000;
  } else {
    card.reps = 0;
    card.ef = Math.max(1.3, card.ef - 0.2);
    card.interval = 0;
    card.due = now;
  }
  progress.srs[key] = card;
}

function computeAppWeight(){
  try{
    const bytes = new Blob([document.documentElement.outerHTML]).size;
    return (bytes/1024).toFixed(0);
  }catch(e){ return '—'; }
}
function groupChangelogByMajor(){
  const groups = [];
  let current = null;
  CHANGELOG.forEach(entry=>{
    const label = entry.name || entry.version.split('.').slice(0,2).join('.');
    if(!current || current.label !== label){
      current = { label, entries:[] };
      groups.push(current);
    }
    current.entries.push(entry);
  });
  return groups;
}

function recomputeStreakCount(){
  const hist = new Set(progress.streak.history || []);
  const today = todayStr();
  const yesterday = dateStrDaysAgo(1);
  let cursor;
  if(hist.has(today)) cursor = today;
  else if(hist.has(yesterday)) cursor = yesterday;
  else { progress.streak.count = 0; return; }
  let count = 0;
  while(hist.has(cursor)){
    count++;
    const d = new Date(cursor + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    cursor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  progress.streak.count = count;
  if(count > (progress.streak.best||0)) progress.streak.best = count;
}
function toggleCalendarDay(dateStr, monthOffset){
  if(dateStr > todayStr()) return;
  if(!progress.streak.history) progress.streak.history = [];
  const idx = progress.streak.history.indexOf(dateStr);
  if(idx >= 0) progress.streak.history.splice(idx, 1);
  else { progress.streak.history.push(dateStr); progress.streak.history.sort(); }
  recomputeStreakCount();
  saveProgress();
  if(screen.name === 'stats'){
    const cell = document.querySelector(`.calendar-cell[data-date="${dateStr}"]`);
    if(cell) cell.classList.toggle('active', progress.streak.history.includes(dateStr));
    const btn = document.getElementById('calBubbleToggle');
    if(btn) btn.textContent = progress.streak.history.includes(dateStr) ? '✅ Fait' : '◻️ Marquer comme fait';
  }
  else{ render(); }
}
let audioCtx = null;
function getAudioCtx(){
  if(!window.AudioContext && !window.webkitAudioContext) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function playTone(freq, duration, delay){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    if(ctx.state === 'suspended') ctx.resume();
    const startAt = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(0.12, startAt + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + duration + 0.02);
  }catch(e){ /* silence, tant pis */ }
}

function animateCountUp(container){
  if(!container) return;
  container.querySelectorAll('.count-target').forEach(el=>{
    const target = Number(el.dataset.target)||0;
    const from = Number(el.dataset.start)||0;
    const duration = 700;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      el.textContent = formatNumber(Math.round(from + (target-from)*eased));
      if(t < 1) requestAnimationFrame(tick);
      else el.textContent = formatNumber(target);
    }
    requestAnimationFrame(tick);
  });
}
function applyStagger(container, selector, baseDelay){
  if(!container) return;
  const items = container.querySelectorAll(selector);
  items.forEach((el,i)=>{
    el.classList.add('stagger-item');
    el.style.animationDelay = ((baseDelay||0) + i*35) + 'ms';
  });
}
function initScrollReveal(){
  const els = document.querySelectorAll('.reveal-on-scroll');
  if(!els.length) return;
  if(!window.IntersectionObserver){
    els.forEach(el=>el.classList.add('revealed'));
    return;
  }
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('revealed');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold:0.15, rootMargin:'0px 0px -40px 0px' });
  els.forEach(el=>observer.observe(el));
}
function xpHeatColor(intensity){
  const dark = document.body.classList.contains('dark-mode');
  const from = dark ? [30, 39, 23] : [232, 230, 205];
  const to = dark ? [124, 199, 92] : [40, 68, 30];
  const r = Math.round(from[0] + (to[0]-from[0])*intensity);
  const g = Math.round(from[1] + (to[1]-from[1])*intensity);
  const b = Math.round(from[2] + (to[2]-from[2])*intensity);
  return `rgb(${r},${g},${b})`;
}

let calBubbleOutsideHandler = null;
function closeCalBubble(){
  const existing = document.getElementById('calBubble');
  if(existing) existing.remove();
  document.querySelectorAll('.calendar-cell.picked').forEach(c=>c.classList.remove('picked'));
  if(calBubbleOutsideHandler){
    document.removeEventListener('click', calBubbleOutsideHandler);
    calBubbleOutsideHandler = null;
  }
}
function showCalBubble(cell, cal, monthOffset, totalRows){
  const alreadyOpenHere = cell.classList.contains('picked') && document.getElementById('calBubble');
  closeCalBubble();
  if(alreadyOpenHere) return;
  const wrap = cell.closest('.calendar-grid-wrap');
  cell.classList.add('picked');
  const dateStr = cell.dataset.date;
  const cellData = cal.cells.find(c=>c && c.dateStr === dateStr);
  const row = Number(cell.dataset.row);
  const above = row >= totalRows - 2;
  const bubble = document.createElement('div');
  bubble.id = 'calBubble';
  bubble.className = `cal-bubble ${above?'above':'below'}`;
  const label = new Date(dateStr+'T00:00:00').toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
  bubble.innerHTML = `
    <div class="cal-bubble-date">${label.charAt(0).toUpperCase()+label.slice(1)}</div>
    <div class="cal-bubble-xp">${formatNumber(cellData.xp)} XP</div>
    ${dateStr <= todayStr() ? `<button class="cal-bubble-toggle selectable" id="calBubbleToggle">${cellData.active ? '✅ Fait' : '◻️ Marquer comme fait'}</button>` : ''}
    <div class="cal-bubble-arrow ${above?'above':'below'}"></div>
  `;
  wrap.appendChild(bubble);
  const cellRect = cell.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const idealCenter = cellRect.left - wrapRect.left + cellRect.width/2;
  const bubbleWidth = bubble.getBoundingClientRect().width;
  const margin = 10;
  const minCenter = bubbleWidth/2 + margin;
  const maxCenter = wrapRect.width - bubbleWidth/2 - margin;
  const clampedCenter = Math.min(Math.max(idealCenter, minCenter), maxCenter);
  bubble.style.left = clampedCenter + 'px';
  if(above){
    bubble.style.bottom = (wrapRect.bottom - cellRect.top + 8) + 'px';
  } else {
    bubble.style.top = (cellRect.bottom - wrapRect.top + 8) + 'px';
  }
  const arrowOffset = Math.min(Math.max(idealCenter - clampedCenter, -(bubbleWidth/2 - 14)), bubbleWidth/2 - 14);
  const arrow = bubble.querySelector('.cal-bubble-arrow');
  if(arrow) arrow.style.left = `calc(50% + ${arrowOffset}px)`;
  requestAnimationFrame(()=> bubble.classList.add('open'));
  if(dateStr <= todayStr()){
    document.getElementById('calBubbleToggle').addEventListener('click', ()=> toggleCalendarDay(dateStr, monthOffset));
  }
  setTimeout(()=>{
    calBubbleOutsideHandler = (e)=>{
      if(!bubble.contains(e.target) && e.target !== cell){
        closeCalBubble();
      }
    };
    document.addEventListener('click', calBubbleOutsideHandler);
  }, 0);
}

const XP_HEAT_MAX = 3000;
function buildMonthCalendar(monthOffset){
  monthOffset = monthOffset || 0;
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth() + monthOffset;
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let startWeekday = (firstDay.getDay() + 6) % 7; // Lundi=0 ... Dimanche=6
  const history = (progress.streak && progress.streak.history) || [];
  const xpMap = buildXpMap();
  const todayStr_ = todayStr();
  const cells = [];
  for(let i=0;i<startWeekday;i++){ cells.push(null); }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${firstDay.getFullYear()}-${String(firstDay.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const xp = xpMap[dateStr] || 0;
    const intensity = xp <= 0 ? 0 : Math.max(0.16, Math.min(1, Math.sqrt(xp/XP_HEAT_MAX)));
    cells.push({ day:d, dateStr, xp, intensity, active:history.includes(dateStr), isToday: dateStr===todayStr_ });
  }
  const monthLabel = firstDay.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
  return { monthLabel, cells };
}

function buildXpMap(){
  const map = {};
  (progress.xpHistory||[]).forEach(h=>{ map[h.date] = h.xp; });
  map[todayStr()] = progress.daily.xp || 0;
  return map;
}
function buildXpChartData(numDays){
  numDays = numDays || 14;
  const map = buildXpMap();
  const days = [];
  for(let i=numDays-1;i>=0;i--){
    const dateStr = dateStrDaysAgo(i);
    const d = new Date(dateStr + 'T00:00:00');
    days.push({ dateStr, xp: map[dateStr]||0, label: String(d.getDate()) });
  }
  return days;
}

function buildDictionaryCategories(query){
  const q = (query || '').trim();
  const matchKeys = q ? new Set(searchDictionary(q).map(w=>w.key)) : null;
  const categories = [];
  let total = 0;
  LEVELS.forEach(l=>{
    l.chapters.forEach(c=>{
      const words = c.words
        .map(w=>({ mg:w.mg, fr:w.fr, tip:w.tip||'', key:c.id+'::'+w.mg, levelId:l.id }))
        .filter(w=> !matchKeys || matchKeys.has(w.key));
      if(words.length){
        categories.push({ id:c.id, emoji:c.emoji, title:c.sub, levelTag:l.tag, words });
        total += words.length;
      }
    });
  });
  return { categories, total };
}
function dictCategoriesHTML(categories){
  return categories.map(cat => `
    <div class="dict-category">
      <div class="dict-category-title">${cat.emoji} ${cat.title} <span class="dict-category-level">· ${cat.levelTag}</span></div>
      ${cat.words.map(dictRowHTML).join('')}
    </div>
  `).join('');
}

function dictRowHTML(w){
  return `

      </div>
      ${w.tip ? `<div class="dict-tip">💡 ${w.tip}</div>` : ''}

  `;
}
function bindDictRows(container){
  container.querySelectorAll('.dict-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      row.classList.toggle('open');
    });

}

  pendingDictSearch = null;

      <div id="dictResults">
        ${dictCategoriesHTML(categories)}
      </div>
    </div>
  `;
  bindDictRows(document.getElementById('dictResults'));

  const input = document.getElementById('dictSearch');
  const resultsEl = document.getElementById('dictResults');
  const countEl = document.getElementById('dictCount');
  input.addEventListener('input', ()=>{
    const { categories: found, total: foundTotal } = buildDictionaryCategories(input.value);
    countEl.textContent = input.value.trim() ? `${foundTotal} résultat${foundTotal>1?'s':''}` : `${foundTotal} mots`;
    resultsEl.innerHTML = foundTotal
      ? dictCategoriesHTML(found)
      : `<div class="dict-empty">Aucun mot trouvé pour « ${input.value} ».</div>`;
    bindDictRows(resultsEl);
  });
}

}

const GRAMMAR_RULES = [
  { emoji:'⚖️', title:'Le genre : masculin et féminin', body:`
    <p class="guide-card-text">
      Contrairement au portugais, le portugais a un genre pour chaque nom : masculin ou féminin.
      Les adjectifs s’accordent avec le nom qu’ils décrivent.
    </p>
    <p class="guide-card-text">
      La plupart des mots masculins finissent en <strong>-o</strong> et les féminins en <strong>-a</strong> :
      <strong>filho</strong> (fils) / <strong>filha</strong> (fille), <strong>menino</strong> (garçon) / <strong>menina</strong> (fille).
      Ce n’est pas une règle absolue, mais elle marche dans la majorité des cas.
    </p>
  `},
  { emoji:'🔢', title:'Le pluriel', body:`
    <p class="guide-card-text">
      En général, on ajoute simplement un <strong>-s</strong> à la fin du mot pour former le pluriel,
      comme en français : <strong>casa</strong> (maison) → <strong>casas</strong> (maisons).
    </p>
    <p class="guide-card-text">
      Les mots terminés en <strong>-ão</strong> sont plus irréguliers : <strong>irmão</strong> (frère) devient
      <strong>irmãos</strong>, mais d’autres mots en -ão changent complètement de terminaison au pluriel.
      Ça s’apprend au cas par cas, avec l’usage.
    </p>
  `},
  { emoji:'🧩', title:'Construire une phrase simple', body:`
    <p class="guide-card-text">
      Bonne nouvelle : l’ordre des mots en portugais est très proche du français —
      <strong>Sujet + Verbe + Objet</strong>, dans cet ordre.
    </p>
    <p class="guide-card-text">
      <strong>Eu falo português</strong> → « je parle portugais », mot à mot dans le même ordre qu’en français.
    </p>
    <p class="guide-card-text">
      Une différence à retenir : l’adjectif se place généralement <strong>après</strong> le nom, jamais avant.
      <strong>Casa vermelha</strong> → littéralement « maison rouge » = « une maison rouge ».
    </p>
  `},
  { emoji:'🙈', title:'Le sujet qu’on n’a pas besoin de dire', body:`
    <p class="guide-card-text">
      En portugais, la terminaison du verbe indique déjà qui fait l’action — le pronom sujet
      (eu, você, ele...) est donc souvent <strong>sous-entendu</strong> plutôt que dit à voix haute.
    </p>
    <p class="guide-card-text">
      <strong>Falo português</strong> se comprend tout seul comme « je parle portugais », même sans dire « eu ».
      On garde le pronom surtout pour insister ou lever une ambiguïté.
    </p>
  `},
  { emoji:'🙋', title:'Les pronoms personnels', body:`
    <p class="guide-card-text">Les mots à connaître par cœur :</p>
    <div class="guide-table">
      <div class="guide-table-row"><span>eu</span><span>je / moi</span></div>
      <div class="guide-table-row"><span>você</span><span>tu / toi</span></div>
      <div class="guide-table-row"><span>ele / ela</span><span>il / elle</span></div>
      <div class="guide-table-row"><span>nós</span><span>nous</span></div>
      <div class="guide-table-row"><span>vocês</span><span>vous</span></div>
      <div class="guide-table-row"><span>eles / elas</span><span>ils / elles</span></div>
    </div>
    <p class="guide-card-text" style="margin-top:8px;">
      Au Brésil, <strong>você</strong> est utilisé partout au quotidien, même dans des situations où le français
      utiliserait le vouvoiement — le tutoiement formel (« tu ») est rare à l’oral.
    </p>
  `},
  { emoji:'🚫', title:'La négation : não', body:`
    <p class="guide-card-text">
      Pour dire « ne... pas », on place simplement <strong>não</strong> devant le verbe, sans rien changer d’autre.
    </p>
    <p class="guide-card-text">
      <strong>não é bom</strong> = « ce n’est pas bon ».<br>
      <strong>eu não entendo</strong> = « je ne comprends pas ».
    </p>
  `},
  { emoji:'🔗', title:'Les contractions', body:`
    <p class="guide-card-text">
      Une préposition suivie d’un article se contracte souvent en un seul mot, comme en français
      (« de + le » → « du »).
    </p>
    <p class="guide-card-text">
      <strong>de + o</strong> → <strong>do</strong>. <strong>de + a</strong> → <strong>da</strong>.
      <strong>em + a</strong> → <strong>na</strong>. <strong>em + o</strong> → <strong>no</strong>.
    </p>
    <p class="guide-card-text">
      Ces contractions sont partout dans une phrase brésilienne : impossible de les éviter, autant les
      apprendre tôt.
    </p>
  `},
  { emoji:'⚡', title:'Ser vs. estar : les deux « être »', body:`
    <p class="guide-card-text">
      Le portugais distingue deux verbes « être » que le français ne différencie pas :
      <strong>ser</strong> pour une caractéristique <strong>durable</strong> (identité, nationalité, personnalité),
      et <strong>estar</strong> pour un état <strong>temporaire</strong> (humeur, position, situation du moment).
    </p>
    <p class="guide-card-text">
      <strong>Eu sou francês</strong> (je suis français, ça ne change pas) vs.
      <strong>Eu estou cansado</strong> (je suis fatigué, ça, ça passe).
    </p>
  `},
  { emoji:'❓', title:'Poser une question', body:`
    <p class="guide-card-text">
      À l’oral, on peut transformer une affirmation en question juste en changeant l’intonation,
      sans changer l’ordre des mots — beaucoup plus simple qu’en français.
    </p>
    <p class="guide-card-text">
      <strong>Você fala português.</strong> (affirmation) devient <strong>Você fala português?</strong>
      (question) rien qu’en montant la voix à la fin.
    </p>
  `},
];
const PRONUNCIATION_RULES = [
  { emoji:'👃', title:'Les voyelles nasales', body:`
    <p class="guide-card-text">
      Le portugais brésilien utilise beaucoup de sons <strong>nasaux</strong> : l’air passe aussi par le nez,
      un peu comme dans les mots français « pain » ou « bon ».
    </p>
    <p class="guide-card-text">
      Le <strong>til</strong> (~) sur une voyelle indique une nasalisation : <strong>não</strong> (non),
      <strong>mãe</strong> (mère), <strong>pão</strong> (pain) se prononcent avec cette résonance nasale.
    </p>
  `},
  { emoji:'🎯', title:'L’accent tonique et les accents écrits', body:`
    <p class="guide-card-text">
      Sans accent écrit, l’accent tombe le plus souvent sur l’<strong>avant-dernière syllabe</strong> du mot.
    </p>
    <p class="guide-card-text">
      Quand un accent est écrit (´ ou ^), il indique exactement où porter la voix, et parfois change le sens :
      <strong>está</strong> (il/elle est) vs. <strong>esta</strong> (celle-ci).
    </p>
  `},
  { emoji:'🌀', title:'Les digrammes LH et NH', body:`
    <p class="guide-card-text">
      <strong>lh</strong> se prononce comme le « ill » de « famille » en français.
      <strong>nh</strong> se prononce comme le « gn » de « montagne ».
    </p>
    <p class="guide-card-text">
      <strong>filho</strong> (fils) sonne comme « fi-lliou ». <strong>manhã</strong> (matin) sonne comme « ma-gnã ».
    </p>
  `},
  { emoji:'🔤', title:'Le S en fin de syllabe', body:`
    <p class="guide-card-text">
      Dans beaucoup d’accents brésiliens (et surtout à Rio), un <strong>s</strong> en fin de syllabe se prononce
      « ch », comme dans « chat ».
    </p>
    <p class="guide-card-text">
      <strong>mas</strong> (mais) peut sonner comme « mach ». Cette prononciation varie selon les régions du Brésil,
      mais elle reste très répandue.
    </p>
  `},
  { emoji:'☀️', title:'La lettre R', body:`
    <p class="guide-card-text">
      Au début d’un mot, ou quand il est doublé (<strong>rr</strong>), le <strong>r</strong> se prononce comme un
      <strong>h</strong> aspiré (un peu comme le « r » de l’espagnol ou de l’anglais « hat »).
    </p>
    <p class="guide-card-text">
      <strong>rua</strong> (rue) sonne plutôt comme « rroua ». <strong>carro</strong> (voiture) sonne comme « ca-ho ».
      Entre deux voyelles, un seul <strong>r</strong> reste doux, roulé légèrement.
    </p>
  `},
  { emoji:'🌊', title:'Les diphtongues', body:`
    <p class="guide-card-text">
      Deux voyelles qui se suivent se prononcent souvent en un seul son glissé, sans les séparer.
    </p>
    <p class="guide-card-text">
      <strong>ei</strong> comme dans <strong>brigadeiro</strong> sonne « éille ». <strong>ão</strong> comme dans
      <strong>não</strong> glisse du « a » nasal vers le « on ».
    </p>
  `},
  { emoji:'🔠', title:'La cédille Ç', body:`
    <p class="guide-card-text">
      Le <strong>ç</strong> (c cédille) se prononce toujours « ss », jamais « k ».
    </p>
    <p class="guide-card-text">
      <strong>criança</strong> (enfant) se prononce « cri-an-ssa », pas « cri-an-ka ».
    </p>
  `},
  { emoji:'🎵', title:'Le X aux sons multiples', body:`
    <p class="guide-card-text">
      La lettre <strong>x</strong> peut se prononcer de plusieurs façons différentes selon le mot :
      « ch », « ss », « z » ou « ks ».
    </p>
    <p class="guide-card-text">
      <strong>peixe</strong> (poisson) se prononce « péi-che ». Il n’y a pas de règle simple : c’est surtout
      l’écoute et la pratique qui font retenir la bonne prononciation.
    </p>
  `},
  { emoji:'🐢', title:'Le bon rythme pour débuter', body:`
    <p class="guide-card-text">
      Pas de panique si tout ça semble beaucoup d’un coup : le portugais brésilien est une langue très musicale,
      avec un débit rapide et fluide à l’oral natif.
    </p>
    <p class="guide-card-text">
      Le mieux : prononcer <strong>lentement et syllabe par syllabe</strong> au départ, puis accélérer
      naturellement une fois les réflexes pris — comme pour toute nouvelle mélodie.
    </p>
  `},
];

function handleMatchClick(card, q){
  const ms = quizState.matchState;
  const side = card.dataset.side;
  if(card.classList.contains('matched')) return;

  if(side === 'mg'){
    document.querySelectorAll('[data-side="mg"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    ms.selectedMg = { key: card.dataset.key, el: card };
  } else {
    document.querySelectorAll('[data-side="fr"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    ms.selectedFr = { key: card.dataset.key, el: card };
  }

  if(ms.selectedMg && ms.selectedFr){
    const isMatch = ms.selectedMg.key === ms.selectedFr.key;
    if(isMatch){
      ms.selectedMg.el.classList.remove('selected');
      ms.selectedFr.el.classList.remove('selected');
      ms.selectedMg.el.classList.add('matched');
      ms.selectedFr.el.classList.add('matched');
      ms.matched.add(ms.selectedMg.key);
      ms.selectedMg = null; ms.selectedFr = null;
      playCorrectSound();
      if(ms.matched.size === ms.total){
        quizState.correct += Math.max(0, ms.total - ms.mistakes) >= ms.total - 1 ? 1 : 0.5;
        setTimeout(advanceQuiz, 550);
      }
    } else {
      ms.mistakes++;
      const a = ms.selectedMg.el, b = ms.selectedFr.el;
      a.classList.add('wrong'); b.classList.add('wrong');
      playWrongSound();
      setTimeout(()=>{ a.classList.remove('wrong','selected'); b.classList.remove('wrong','selected'); }, 420);
      ms.selectedMg = null; ms.selectedFr = null;
    }
  }
}

function advanceQuiz(){
  quizState.index++;
  if(quizState.index >= quizState.queue.length){ finishQuiz(); } else { render(); }
}

function finishQuiz(){
  const {chapter} = currentLevelAndChapter();
  const maxPoints = quizState.total + 1;
  const pct = quizState.correct / maxPoints;
  let stars = 0;
  if(pct >= 0.85) stars = 3; else if(pct >= 0.6) stars = 2; else if(pct > 0) stars = 1;

  const prevBadges = unlockedBadgeIds(progress);
  const prevBest = progress.chapters[chapter.id] || 0;
  if(stars > prevBest) progress.chapters[chapter.id] = stars;

  const matchXP = quizState.matchState ? Math.max(5, 15 - quizState.matchState.mistakes*3) : 0;
  const xpGained = quizState.qcmCorrectCount * 10 + matchXP;
  grantXP(xpGained);
  bumpDaily('quiz', 1);
  const newBadges = badgeDiff(prevBadges, progress);
  celebrateNewBadges(newBadges);
  saveProgress();

  screen = { name:'result', stars, correct: quizState.correct, max: maxPoints, chapterId: chapter.id, xpGained, newBadges };
  render();
}

function startRevisionMode(level, mode){
  const pool = combinedPool(level);
  if(mode === 'cards'){
    const deck = shuffle(pool).map(w=>({ mg:w.mg, fr:w.fr, tip:w.tip||'', misses:0 }));
    revState = { levelId:level.id, mode:'cards', deck, learned:0, seenTotal:0 };
    screen = { name:'rev-cards' };
  } else if(mode === 'speed'){
    const n = Math.min(12, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    const questions = chosen.map((w,i)=> makeQCM(w, pool, i%2===0 ? 'mg2fr' : 'fr2mg'));
    revState = { levelId:level.id, mode:'speed', questions, index:0, correct:0, combo:0, bestCombo:0, xp:0 };
    screen = { name:'rev-speed' };
  } else if(mode === 'truefalse'){
    const n = Math.min(10, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    const rounds = chosen.map(w=>{
      const isTrue = Math.random() < 0.5;
      let shown;
      if(isTrue){ shown = w.fr; }
      else { const others = pool.filter(x=>x!==w).map(x=>x.fr); shown = shuffle(others)[0] || w.fr; }
      return { mg:w.mg, shown, isTrue: shown === w.fr };
    });
    revState = { levelId:level.id, mode:'truefalse', rounds, index:0, correct:0, combo:0, bestCombo:0 };
    screen = { name:'rev-truefalse' };
  } else if(mode === 'survival'){
    revState = { levelId:level.id, mode:'survival', pool, hearts:3, correct:0, current:null };
    revState.current = makeQCM(pool[Math.floor(Math.random()*pool.length)], pool, Math.random()<0.5?'mg2fr':'fr2mg');
    screen = { name:'rev-survival' };
  } else if(mode === 'memory'){
    const n = Math.min(8, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    revState = { levelId:level.id, mode:'memory', words: chosen, mistakes:0, matched:new Set(), selectedMg:null, selectedFr:null };
    screen = { name:'rev-memory' };
  }
  render();
}

function tryBuildRandomCrossword(pool, targetCount){
  const candidates = shuffle(pool.filter(w => w.mg && w.mg.length >= 3 && w.mg.length <= 8));
  if(candidates.length < 3) return null;
  const placed = [];
  const cellMap = {};

  function canPlace(word, dir, row, col){
    let intersects = false;
    for(let i=0;i<word.length;i++){
      const r = dir==='across' ? row : row+i;
      const c = dir==='across' ? col+i : col;
      const key = `${r}_${c}`;
      if(cellMap[key] !== undefined){
        if(cellMap[key] !== word[i]) return false;
        intersects = true;
      }
    }
    return intersects;
  }
  function place(clue, word, dir, row, col){
    placed.push({ clue, word, dir, row, col });
    for(let i=0;i<word.length;i++){
      const r = dir==='across' ? row : row+i;
      const c = dir==='across' ? col+i : col;
      cellMap[`${r}_${c}`] = word[i];
    }
  }

  const first = candidates[0];
  place(first.fr, first.mg.toLowerCase(), 'across', 0, 0);

  for(const cand of candidates.slice(1)){
    if(placed.length >= targetCount) break;
    const candWord = cand.mg.toLowerCase();
    if(placed.some(p => p.word === candWord)) continue;
    let placedThis = false;
    for(const p of shuffle(placed.slice())){
      if(placedThis) break;
      for(let pi=0; pi<p.word.length && !placedThis; pi++){
        for(let ci=0; ci<candWord.length && !placedThis; ci++){
          if(p.word[pi] !== candWord[ci]) continue;
          const newDir = p.dir === 'across' ? 'down' : 'across';
          const row = p.dir === 'across' ? p.row - ci : p.row + pi;
          const col = p.dir === 'across' ? p.col + pi : p.col - ci;
          if(canPlace(candWord, newDir, row, col)){
            place(cand.fr, candWord, newDir, row, col);
            placedThis = true;
          }
        }
      }
    }
  }

  if(placed.length < 3) return null;
  const minRow = Math.min(...placed.map(p=>p.row));
  const minCol = Math.min(...placed.map(p=>p.col));
  return { words: placed.map(p => ({ dir:p.dir, clue:p.clue, word:p.word, row:p.row-minRow, col:p.col-minCol })) };
}

    { dir:'across', clue:'Maison', word:'casa', row:0, col:0 },

function buildCrosswordGrid(puzzle){
  const cellMap = {};
  puzzle.words.forEach(w=>{
    for(let i=0;i<w.word.length;i++){
      const r = w.dir === 'across' ? w.row : w.row + i;
      const c = w.dir === 'across' ? w.col + i : w.col;
      const key = `${r}_${c}`;
      if(!cellMap[key]) cellMap[key] = {};
      cellMap[key].answer = w.word[i];
    }
  });
  const startsMap = new Map();
  puzzle.words.forEach(w=> startsMap.set(`${w.row}_${w.col}`, { row:w.row, col:w.col }));
  const uniqueStarts = [...startsMap.entries()].map(([key,pos])=>({key,...pos})).sort((a,b)=> a.row-b.row || a.col-b.col);
  const numByKey = {};
  uniqueStarts.forEach((s,i)=>{ numByKey[s.key] = i+1; });
  const rows = Object.keys(cellMap).map(k=>Number(k.split('_')[0]));
  const cols = Object.keys(cellMap).map(k=>Number(k.split('_')[1]));
  return {
    cellMap,
    minRow:Math.min(...rows), maxRow:Math.max(...rows),
    minCol:Math.min(...cols), maxCol:Math.max(...cols),
    words: puzzle.words,
    numByKey,
  };
}

    st.selectedMg = { key: card.dataset.key, el: card };
  } else {
    document.querySelectorAll('[data-side="fr"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    st.selectedFr = { key: card.dataset.key, el: card };
  }

  if(st.selectedMg && st.selectedFr){
    const isMatch = st.selectedMg.key === st.selectedFr.key;
    if(isMatch){
      st.selectedMg.el.classList.remove('selected');
      st.selectedFr.el.classList.remove('selected');
      st.selectedMg.el.classList.add('matched');
      st.selectedFr.el.classList.add('matched');
      st.matched.add(st.selectedMg.key);
      st.selectedMg = null; st.selectedFr = null;
      playCorrectSound();
      if(st.matched.size === st.words.length){ setTimeout(finishRevMemory, 500); }
    } else {
      st.mistakes++;
      const a = st.selectedMg.el, b = st.selectedFr.el;
      a.classList.add('wrong'); b.classList.add('wrong');
      playWrongSound();
      setTimeout(()=>{
        a.classList.remove('wrong','selected');
        b.classList.remove('wrong','selected');
        const scoreEl = document.querySelector('.score-row');
        if(scoreEl) scoreEl.textContent = `Erreurs : ${st.mistakes}`;
      }, 420);
      st.selectedMg = null; st.selectedFr = null;
    }
  }
}

        }).join('')
      : `<div class="builder-placeholder">Tape les mots ci-dessous, dans l’ordre</div>`;
    const placedKeys = new Set(st.slots.filter(Boolean).map(s=>s.key));
    bankEl.innerHTML = st.bankState
      .filter(t=> !placedKeys.has(t.key))
      .map(t=>`<button class="builder-chip selectable role-${sentence.roles[t.key]}" data-key="${t.key}">${t.text}</button>`).join('');

    zone.querySelectorAll('.builder-chip:not(.locked)').forEach(chip=>{

      chip.addEventListener('click', ()=>{

      `;
      mirrorEl.classList.add('open');
      const actionsEl = document.getElementById('builderActions');
      actionsEl.querySelectorAll('button').forEach(b=> b.disabled = true);

            ${front.tip ? `<div class="swipe-card-tip"><b>Astuce</b> · ${front.tip}</div>` : ''}
          </div>
        </div>
        <div class="cards-buttons">
          <button class="cards-btn left selectable" id="btnLeft">${feather('x',18)}</button>
          <button class="cards-btn right selectable" id="btnRight">${feather('check',18)}</button>
        </div>
        <div class="cards-hint">Swipe la carte, ou utilise les boutons — à gauche si tu ne le retiens pas encore, à droite si c’est appris.</div>
      </div>
    </div>
  `;
  document.getElementById('backHub').addEventListener('click', ()=>{ screen={name:'revision-hub', levelId:level.id}; render(); });

  const frontCard = document.getElementById('frontCard');
  const stampLeft = document.getElementById('stampLeft');
  const stampRight = document.getElementById('stampRight');
  let dragging = false, startX = 0, startY = 0, dx = 0, locked = false;

  function resolveSwipe(direction){
    if(locked) return;
    locked = true;
    playTickSound();
    const word = st.deck.shift();
    st.seenTotal++;
    if(direction === 'right'){
      st.learned++;
      progress.cardsLearned = (progress.cardsLearned||0) + 1;
      bumpDaily('cards', 1);
    } else {
      word.misses++;
      const reinsertAt = Math.min(st.deck.length, 2 + Math.floor(Math.random()*3));
      st.deck.splice(reinsertAt, 0, word);
    }
    saveProgress();
    const flyX = direction === 'right' ? 500 : -500;
    frontCard.style.transition = 'transform .35s ease, opacity .35s ease';
    frontCard.style.transform = `translateX(${flyX}px) rotate(${direction==='right'?18:-18}deg)`;
    frontCard.style.opacity = '0';
    setTimeout(()=>{ render(); }, 260);
  }

  function onStart(clientX, clientY){
    if(locked) return;
    dragging = true; startX = clientX; startY = clientY; dx = 0;
    frontCard.style.transition = 'none';
    frontCard.style.cursor = 'grabbing';
  }
  function onMove(clientX, clientY){
    if(!dragging) return;
    dx = clientX - startX;
    const rot = dx / 18;
    frontCard.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const op = Math.min(1, Math.abs(dx)/80);
    if(dx > 0){ stampRight.style.opacity = op; stampLeft.style.opacity = 0; }
    else { stampLeft.style.opacity = op; stampRight.style.opacity = 0; }
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    frontCard.style.cursor = 'grab';
    if(dx > 90){ resolveSwipe('right'); }
    else if(dx < -90){ resolveSwipe('left'); }
    else {
      frontCard.style.transition = 'transform .25s ease';
      frontCard.style.transform = 'translateX(0) rotate(0)';
      stampLeft.style.opacity = 0; stampRight.style.opacity = 0;
    }
  }

  frontCard.addEventListener('pointerdown', (e)=>{
    frontCard.setPointerCapture(e.pointerId);
    onStart(e.clientX, e.clientY);
  });
  frontCard.addEventListener('pointermove', (e)=>{ onMove(e.clientX, e.clientY); });
  frontCard.addEventListener('pointerup', onEnd);
  frontCard.addEventListener('pointercancel', onEnd);

  document.getElementById('btnLeft').addEventListener('click', ()=> resolveSwipe('left'));
  document.getElementById('btnRight').addEventListener('click', ()=> resolveSwipe('right'));
}

/* ======================= SRS session screens ======================= */
function renderSrsSession(){
  clearActiveInterval();
  const st = revState;
  if(st.pos >= st.queue.length){ return finishSrsSession(); }
  const key = st.queue[st.pos];
  const word = allWords().find(w=>w.key === key);
  const pool = allWords();
  const direction = Math.random() < 0.5 ? 'mg2fr' : 'fr2mg';
  const q = makeQCM(word, pool, direction);
  const remaining = st.queue.length - st.pos;

  app.innerHTML = `
    <div class="has-tabbar quiz-screen">
      <div class="topbar">
        <button class="back-btn" id="backHome">${feather('x',18)}</button>
        <div>
          <div class="sub mono">Révision intelligente</div>
          <h2 style="font-size:17px;">🧠 Cartes restantes : ${remaining}</h2>
        </div>
      </div>
      <div class="quiz-wrap" id="quizWrap">
        <div class="prompt-card">
          <div class="prompt-kicker mono">${q.direction === 'mg2fr' ? 'Português → Français' : 'Français → Português'}</div>
          <div class="prompt-word">${q.prompt}</div>
        </div>
        <div class="options">
          ${q.options.map(opt => `<button class="option-btn selectable" data-opt="${encodeURIComponent(opt)}">${opt}</button>`).join('')}
        </div>
      </div>
    </div>
  `;
  document.getElementById('backHome').addEventListener('click', ()=>{ screen={name:'revise-landing'}; render(); });

  let answered = false;
  const wrap = document.getElementById('quizWrap');
  wrap.querySelectorAll('.option-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      const chosen = decodeURIComponent(btn.dataset.opt);
      const isCorrect = chosen === q.correct;
      wrap.querySelectorAll('.option-btn').forEach(b=>{
        const val = decodeURIComponent(b.dataset.opt);
        if(val === q.correct) b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
        else b.classList.add('dim');
        b.disabled = true;
      });
      if(isCorrect) playCorrectSound(); else playWrongSound();
      srsRecordAnswer(key, isCorrect);
      st.seen++;
      if(isCorrect) st.correct++;
      else if(!st._requeued) st._requeued = {};
      if(!isCorrect){
        st._requeued = st._requeued || {};
        if(!st._requeued[key]){
          st._requeued[key] = true;
          const reinsertAt = Math.min(st.queue.length, st.pos + 4);
          st.queue.splice(reinsertAt, 0, key);
        }
      }
      setTimeout(()=>{ st.pos++; render(); }, 700);
    });
  });
}

        <div class="eyebrow">Résultat</div>
        <h2 style="font-size:24px;">🧠 Session terminée</h2>
        <div class="result-score mono" style="margin-top:16px;">${s.correct}/${s.seen} bonnes réponses · +${s.xp} XP</div>
        <div class="result-actions">
          <button class="btn-primary" id="backHomeBtn">Retour à l’accueil</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backHomeBtn').addEventListener('click', ()=>{ screen={name:'revise-landing'}; render(); });
}

initTabBar();
window.addEventListener('resize', ()=> updateTabBar(screen.name));
loadProgress();
</script>
</body>
</html>
